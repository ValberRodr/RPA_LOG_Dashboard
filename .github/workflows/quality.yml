name: Validar aplicação

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'sqlite_log_store.py'
      - 'test_server.py'
      - 'test_sqlite_log_store.py'
      - 'test_dashboard.js'
      - 'assets/dashboard-app.js'
      - 'assets/auto-refresh.js'
      - 'index.html'
      - 'investigacao.html'
      - 'diagnostico.html'
      - 'rpa-dashboard.html'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes backend + SQLite
        run: python -m unittest -v test_server.py test_sqlite_log_store.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes frontend
        run: node test_dashboard.js
